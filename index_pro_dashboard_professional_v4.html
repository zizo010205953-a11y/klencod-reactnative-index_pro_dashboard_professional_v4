/* Palette matched to the user's reference screenshots */
:root{--bg:#0f1120;--panel:#1b1e2b;--panel2:#202333;--gold:#f5b52e;--gold2:#ffd36a;--text:#f7f7fb;--muted:#777987;--line:#292c3b;--green:#3fc9a2;--red:#ec6d91}
body{background:#0f1120;color:var(--text)}
.side{background:#101220;border-color:#242736}
.login-card{background:#1b1e2b;border-color:#292c3b}
.nav button.active,.nav button:hover{background:#25283a;border-color:#303449;color:var(--gold)}
button{background:var(--gold);color:#171725}
button.secondary{background:#303341;color:#f7f7fb;border-color:#3b3e4d}
button.danger{background:#472638;color:#ff91ac}
input,select,textarea{background:#202332;color:#f7f7fb;border-color:#303344}
.card{background:#1b1e2b;border-color:#292c3b}
.invoice{background:#1b1e2b;border-color:#292c3b}
.pill{background:#292c3b;color:var(--gold)}
.status{background:#153f37;color:#3fc9a2}.status.due{background:#432536;color:#ec6d91}
.gold-banner{background:#102b2b;color:#55d3b1}
.gold-banner button{background:#143b35;color:#55d3b1}
th,td{border-bottom-color:#292c3b}th{color:var(--gold)}
.bar{background:#292c3b}
@media(max-width:900px){.mobile-nav{background:#171a29f5;border-top-color:#292c3b}.mobile-nav button{color:#8b8d9b}.mobile-nav button.active{color:var(--gold)}}

/* Debt page spacing fixes */
.debt-form-card{padding:20px;overflow:hidden}
.debt-form-card .section-title{align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.debt-form-card .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px;align-items:start}
.debt-form-card .formgrid>div{min-width:0;display:flex;flex-direction:column;gap:9px}
.debt-form-card .formgrid>div.full{grid-column:1/-1}
.debt-form-card label{display:block;line-height:1.7;margin:0 0 2px;font-weight:600;color:var(--muted)}
.debt-form-card input,.debt-form-card textarea{width:100%;min-width:0;box-sizing:border-box;display:block;line-height:1.5;padding:13px 14px;margin:0;border-radius:12px}
.debt-form-card textarea{resize:vertical;min-height:82px}
.debt-form-card .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.debt-record{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px}
.debt-record-main{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.debt-record .amounts{display:flex;flex-wrap:wrap;gap:10px 18px;line-height:1.9;margin-top:12px}
.debt-record-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0;align-items:center}
.debt-record-actions button{white-space:nowrap}
@media(max-width:600px){.debt-form-card{padding:15px}.debt-form-card .formgrid{grid-template-columns:minmax(0,1fr);gap:15px}.debt-form-card .formgrid>div.full{grid-column:auto}.debt-form-card input,.debt-form-card textarea{font-size:16px}.debt-form-card .actions button{flex:1 1 130px}.debt-record{padding:15px;gap:12px}.debt-record-main{flex-basis:100%}.debt-record-actions{width:100%}.debt-record-actions button{flex:1 1 80px}}



/* إصلاح ظهور أقسام البرنامج على الموبايل */
@media(max-width:900px){
  #app .layout{display:block!important;}
  #app .side{display:none!important;}
  #app .main{display:block!important;width:100%!important;padding:18px 14px 100px!important;}
  #app #mobileNav{display:flex!important;visibility:visible!important;opacity:1!important;position:fixed!important;bottom:0!important;right:0!important;left:0!important;z-index:9999!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:2px!important;}
  #app #mobileNav button{display:block!important;flex:1 0 auto!important;white-space:nowrap!important;min-width:max-content!important;padding:9px 8px!important;}
}
@media(min-width:901px){#app .side{display:block!important;}#app #mobileNav{display:none!important;}}
.stage-card{cursor:pointer;transition:transform .15s,border-color .15s}.stage-card:hover{transform:translateY(-2px);border-color:var(--gold)}
@media print{body.report-print #content>*{display:block!important;visibility:visible!important}body.report-print #content>#printArea{display:none!important}body.report-print #content .card,body.report-print #content section{display:block!important;break-inside:avoid}body.report-print .no-print,body.report-print .actions,body.report-print button,body.report-print input,body.report-print select{display:none!important}body.report-print .list{display:block!important}body.report-print .invoice{break-inside:avoid;color:#111!important;background:#fff!important;border:1px solid #bbb!important}body.report-print .muted,body.report-print .amounts{color:#111!important}}

function homeDebtorData(){let names=[...new Set(db.invoices.map(i=>(i.customer||'').trim()).filter(Boolean))];return names.map(name=>{let a=db.invoices.filter(i=>(i.customer||'').trim()===name),balance=a.reduce((sum,i)=>sum+due(i),0);return{name,balance,count:a.filter(i=>due(i)>0).length,phone:(a.slice().reverse().find(i=>i.phone)||{}).phone||''}}).filter(c=>c.balance>0.009).sort((a,b)=>b.balance-a.balance)}function homeDebtors(){let cs=homeDebtorData();return cs.length?`<div class="list">${cs.slice(0,8).map((c,n)=>`<div class="invoice"><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="amounts"><span>فواتير عليها رصيد: ${c.count}</span>${c.phone?`<span>هاتف: ${esc(c.phone)}</span>`:''}</div></div><b class="gold">${money(c.balance)}</b><button class="secondary" onclick="openHomeDebtor(${n})">التفاصيل</button></div>`).join('')}</div>${cs.length>8?`<div class="muted" style="margin-top:10px">يتم عرض أول ٨ عملاء حسب أعلى مديونية.</div>`:''}`:'<div class="empty">مفيش عملاء عليهم مديونية حالياً 🎉</div>'}function openHomeDebtor(index){let c=homeDebtorData()[index];if(!c)return;window.currentCustomer=c.name;go('customerDetail')}function stageCard(t,n,ic){return `<div class="card stage-card" role="button" tabindex="0" onclick="stageFilter('${t}')" onkeydown="if(event.key==='Enter')stageFilter('${t}')"><div class="row"><span class="stat-label">${t}</span><span class="gold">${ic}</span></div><div class="stat-num">${n}</div><small>اضغط لعرض الطلبات</small></div>`}function stageFilter(stage){window.invoiceStageFilter=stage;go('invoices')}function activeJobs(){return db.invoices.filter(i=>(i.productionStatus||'قيد التصميم')!=='تم التسليم').slice().reverse().slice(0,8)}function quickStage(id,stage){let i=db.invoices.find(x=>x.id===id);if(!i)return;i.productionStatus=stage;save();render()}function stat(t,n,ic){return `<div class="card"><div class="row"><span class="stat-label">${t}</span><span class="gold">${ic}</span></div><div class="stat-num">${n}</div></div>`}
function invoices(){let all=filteredInvoices();return `<div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('عدد الفواتير',db.invoices.length,'▤')}${stat('إجمالي المديونية',money(db.invoices.reduce((s,i)=>s+due(i),0)),'◷')}</div><div class="card"><div class="section-title"><input id="invoiceSearch" placeholder="ابحث باسم العميل..." oninput="filterInvoices()" style="max-width:400px"><button onclick="startInvoice()">＋ فاتورة / أمر شغل</button></div><div class="formgrid"><div><label>فلترة مرحلة العمل</label><select id="stageFilter" onchange="window.invoiceStageFilter=this.value;filterInvoices()"><option value="الكل">كل المراحل</option>${['قيد التصميم','قيد الطباعة','جاهز للتسليم','تم التسليم'].map(x=>`<option ${window.invoiceStageFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>فلترة الدفع</label><select id="payFilter" onchange="window.invoicePayFilter=this.value;filterInvoices()"><option value="الكل">كل حالات الدفع</option><option value="متبقي">المتبقي عليها مبالغ</option><option value="خالصة">خالصة</option></select></div></div><div id="invoiceResults">${all.length?invoiceList(all):'<div class="empty">لا توجد فواتير. أنشئ أول فاتورة الآن.</div>'}</div></div>`}function invoiceList(arr){return `<div class="list">${arr.map(i=>`<div class="invoice"><div onclick="openInvoice(${i.id})" style="cursor:pointer"><b>${esc(i.customer)}</b> <span class="status ${due(i)>0?'due':''}">${due(i)>0?'متبقي':'مدفوعة'}</span> <span class="production-status">${esc(i.productionStatus||'قيد التصميم')}</span><div><small>${i.date} · فاتورة #${i.id}</small></div><div class="amounts"><span>الإجمالي: ${money(total(i))}</span><span>المدفوع: ${money(paid(i))}</span><span>المتبقي: ${money(due(i))}</span></div></div><button class="secondary" onclick="openInvoice(${i.id})">التفاصيل ←</button></div>`).join('')}</div>`}function filteredInvoices(){let q=($('invoiceSearch')?.value||'').toLowerCase(),stage=window.invoiceStageFilter||'الكل',pay=window.invoicePayFilter||'الكل';return db.invoices.slice().reverse().filter(i=>(i.customer||'').toLowerCase().includes(q)&&(stage==='الكل'||(i.productionStatus||'قيد التصميم')===stage)&&(pay==='الكل'||(pay==='متبقي'?due(i)>0:due(i)<=0)))}function filterInvoices(){if($('invoiceResults'))$('invoiceResults').innerHTML=filteredInvoices().length?invoiceList(filteredInvoices()):'<div class="empty">لا توجد فواتير تطابق الفلاتر.</div>'}
function autofillPhone(name){let found=db.invoices.slice().reverse().find(i=>(i.customer||'').trim().toLowerCase()===String(name||'').trim().toLowerCase()&&i.phone);if(found&&$('custPhone'))$('custPhone').value=found.phone}function startInvoice(){window.editingInvoiceId=null;invoiceDraft=[{name:'',qty:1,price:0,cost:0,unit:'قطعة',length:0,width:0,note:''}];go('new')}function newInvoice(){let cats=[...new Set(db.items.map(i=>i.category||'عام'))];return `<div class="new-invoice-screen" dir="rtl"><div class="new-invoice-top"><button class="round-back" onclick="go('invoices')" aria-label="رجوع">‹</button><h2>فاتورة جديدة</h2><button class="round-save" onclick="saveInvoice()" aria-label="حفظ">⇧</button></div><section class="invoice-section customer-section"><label>اسم العميل</label><input id="custName" list="customerOptions" placeholder="اكتب اسم العميل" autocomplete="off" oninput="autofillPhone(this.value)" onchange="autofillPhone(this.value)"><datalist id="customerOptions">${uniqueCustomers().map(c=>`<option>${esc(c)}</option>`).join('')}</datalist><label>رقم واتساب العميل (اختياري)</label><input id="custPhone" placeholder="مثال: 01012345678" inputmode="tel"><label>تاريخ الفاتورة</label><input id="invDate" type="date" value="${new Date().toISOString().slice(0,10)}"></section><div class="section-title invoice-items-title"><h3>الأصناف</h3><button class="quick-add" onclick="addLine()">＋ إضافة صنف</button></div><section class="invoice-section saved-items"><div class="saved-items-heading">▧　من الأصناف المحفوظة</div>${cats.length?cats.map(cat=>`<div class="saved-category"><div class="saved-category-name">${esc(cat)}</div><div class="saved-chip-list">${db.items.filter(i=>(i.category||'عام')===cat).map(i=>`<button type="button" class="saved-item-chip" onclick="quickPickItem(${i.id})">${esc(i.name)} <small>◇</small></button>`).join('')}</div></div>`).join(''):'<div class="muted">أضف أصنافًا من قسم الأصناف لتظهر هنا.</div>'}<div class="saved-items-hint">اضغط على الصنف لإضافته إلى الفاتورة</div></section><section class="invoice-section invoice-lines-section"><div id="lines">${lineEditor()}</div></section><section class="invoice-section invoice-summary"><div class="summary-row"><span>المجموع</span><b id="draftSubtotal">0</b></div><label>الخصم (اختياري)</label><input id="discount" type="number" min="0" step="0.01" placeholder="0" oninput="calcDraft()"><label>طريقة الدفع</label><select id="payMethod"><option>نقدي</option><option>تحويل بنكي</option><option>محفظة إلكترونية</option><option>آجل</option></select><label>المبلغ المدفوع الآن</label><input id="paidNow" type="number" min="0" step="0.01" placeholder="0" oninput="calcDraft()"><div class="summary-row grand-total"><span>الإجمالي الكلي</span><b id="draftTotal">0 ج.م</b></div><div class="summary-row remaining-row"><span>المتبقي</span><b id="draftDue">0 ج.م</b></div></section><details class="invoice-section more-invoice-options"><summary>تفاصيل إضافية للفاتورة</summary><label>موعد التسليم المتوقع</label><input id="deliveryDate" type="date"><label>حالة تنفيذ الطلب</label><select id="productionStatus"><option>قيد التصميم</option><option>قيد الطباعة</option><option>جاهز للتسليم</option><option>تم التسليم</option></select><label>ملاحظات عامة على الفاتورة / أمر الشغل</label><textarea id="invoiceNotes" rows="2" placeholder="ملاحظات للمتابعة"></textarea></details><div class="invoice-bottom-actions"><button onclick="saveInvoice()">حفظ الفاتورة</button><button class="secondary" onclick="go('invoices')">إلغاء</button></div></div>`}
function quickPickItem(id){let it=db.items.find(x=>x.id===Number(id));if(!it)return;let empty=invoiceDraft.findIndex(l=>!l.name.trim());if(empty<0){invoiceDraft.push({name:'',qty:1,price:0,cost:0,unit:'قطعة',length:0,width:0,note:''});empty=invoiceDraft.length-1}invoiceDraft[empty]={...invoiceDraft[empty],name:it.name,qty:1,price:Number(it.sell)||0,cost:Number(it.buy)||0,unit:it.unit||'قطعة',itemId:it.id,length:0,width:0,pieces:1};$('lines').innerHTML=lineEditor();calcDraft()}
function lineEditor(){return invoiceDraft.map((l,n)=>`<div class="card" style="margin-bottom:10px"><div class="formgrid"><div><label>اسم الصنف</label><input value="${esc(l.name)}" list="itemOptions" onchange="setLine(${n},'name',this.value)" oninput="setLine(${n},'name',this.value)" placeholder="اكتب اسم الصنف"></div><div><label>من الأصناف المحفوظة</label><select onchange="chooseItem(${n},this.value)"><option value="">اختر صنفاً...</option>${db.items.map(i=>`<option value="${i.id}">${esc(i.name)} — ${esc(i.category)}</option>`).join('')}</select><datalist id="itemOptions">${db.items.map(i=>`<option>${esc(i.name)}</option>`).join('')}</datalist></div>${l.unit==='متر'||l.unit==='متر مربع'?`<div><label>الطول (متر)</label><input type="number" inputmode="decimal" min="0.01" step="any" value="${Number(l.length)||''}" placeholder="الطول" oninput="setDimension(${n},'length',this.value)"></div><div><label>العرض (متر)</label><input type="number" inputmode="decimal" min="0.01" step="any" value="${Number(l.width)||''}" placeholder="العرض" oninput="setDimension(${n},'width',this.value)"></div><div><label>عدد القطع (تكرار نفس المقاس)</label><input type="number" min="1" step="1" value="${Number(l.pieces)||''}" placeholder="1" oninput="setPieces(${n},this.value)"></div><div><label>إجمالي المساحة (م²)</label><input id="dimQty${n}" type="number" step="any" value="${(Number(l.length)||0)*(Number(l.width)||0)*(Number(l.pieces)||1)||''}" readonly></div>`:`<div><label>الكمية</label><input type="number" min="0.01" step="0.01" value="${Number(l.qty)||''}" placeholder="الكمية" oninput="setLine(${n},'qty',this.value)"></div>`}<div><label>الوحدة</label><select onchange="setLine(${n},'unit',this.value);$('lines').innerHTML=lineEditor()">${['قطعة','متر','متر مربع','علبة','رزمة','كيلو','لفة','طقم','خدمة','أخرى'].map(u=>`<option value="${u}" ${l.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>سعر الوحدة</label><input type="number" min="0" value="${Number(l.price)||''}" placeholder="السعر" oninput="setLine(${n},'price',this.value)"></div><div><label>التكلفة للوحدة</label><input type="number" min="0" value="${Number(l.cost)||''}" placeholder="التكلفة" oninput="setLine(${n},'cost',this.value)"></div><div class="full"><label>ملاحظات / النص المطلوب (اختياري)</label><input value="${esc(l.note||'')}" oninput="setLine(${n},'note',this.value)" placeholder="مثال: النص المكتوب على البنر"></div></div><div class="row" style="margin-top:10px"><span class="muted">إجمالي البند: <b class="gold">${money(l.qty*l.price)}</b></span>${invoiceDraft.length>1?`<button class="danger" onclick="removeLine(${n})">حذف البند</button>`:''}</div></div>`).join('')}function setPieces(n,v){invoiceDraft[n].pieces=Math.max(1,Number(v)||1);invoiceDraft[n].qty=(Number(invoiceDraft[n].length)||0)*(Number(invoiceDraft[n].width)||0)*invoiceDraft[n].pieces;let q=$('dimQty'+n);if(q)q.value=invoiceDraft[n].qty||'';calcDraft()}function setLine(n,k,v){invoiceDraft[n][k]=['qty','price','cost'].includes(k)?Number(v)||0:v;if(k==='unit'&&(v==='متر'||v==='متر مربع')){invoiceDraft[n].length=Number(invoiceDraft[n].length)||0;invoiceDraft[n].width=Number(invoiceDraft[n].width)||0;invoiceDraft[n].qty=invoiceDraft[n].length*invoiceDraft[n].width}else if(k==='length'||k==='width'){invoiceDraft[n].qty=(Number(invoiceDraft[n].length)||0)*(Number(invoiceDraft[n].width)||0)}calcDraft()}function setDimension(n,k,v){let normalized=String(v??'').replace(',', '.');invoiceDraft[n][k]=normalized.trim()===''?0:Number(normalized);if(!Number.isFinite(invoiceDraft[n][k]))invoiceDraft[n][k]=0;invoiceDraft[n].qty=(Number(invoiceDraft[n].length)||0)*(Number(invoiceDraft[n].width)||0)*(Number(invoiceDraft[n].pieces)||1);let q=$('dimQty'+n);if(q)q.value=invoiceDraft[n].qty?Number(invoiceDraft[n].qty.toFixed(4)):'';calcDraft()}function chooseItem(n,id){let it=db.items.find(x=>x.id===Number(id));if(!it)return;invoiceDraft[n]={...invoiceDraft[n],name:it.name,price:it.sell,cost:it.buy,unit:it.unit,itemId:it.id,length:0,width:0};$('lines').innerHTML=lineEditor();calcDraft()}function addLine(){invoiceDraft.push({name:'',qty:1,price:0,cost:0,unit:'قطعة',note:''});$('lines').innerHTML=lineEditor()}function removeLine(n){invoiceDraft.splice(n,1);$('lines').innerHTML=lineEditor();calcDraft()}function calcDraft(){let sum=invoiceDraft.reduce((s,l)=>s+l.qty*l.price,0),d=Number($('discount')?.value)||0,p=Number($('paidNow')?.value)||0;if($('draftSubtotal'))$('draftSubtotal').textContent=money(sum);if($('draftTotal'))$('draftTotal').textContent=money(Math.max(0,sum-d));if($('draftDue'))$('draftDue').textContent=money(Math.max(0,sum-d-p))}function saveInvoice(){let customer=$('custName').value.trim();if(!customer){alert('اكتب اسم العميل');return}if(!invoiceDraft.length||invoiceDraft.some(l=>!l.name.trim()||l.qty<=0)){alert('أكمل بيانات الأصناف والكمية');return}let id=db.nextId++,inv={id,customer,phone:$('custPhone').value.trim(),date:$('invDate').value,method:$('payMethod').value,productionStatus:$('productionStatus')?.value||'قيد التصميم',deliveryDate:$('deliveryDate')?.value||'',notes:$('invoiceNotes')?.value.trim()||'',discount:Number($('discount').value)||0,paid:Number($('paidNow').value)||0,lines:invoiceDraft.map(l=>({...l}))};if(inv.paid>total(inv)){alert('المبلغ المدفوع أكبر من إجمالي الفاتورة');return}if(window.editingInvoiceId){let old=db.invoices.find(x=>x.id===window.editingInvoiceId);if(!old)return;let previousPayments=db.payments.filter(p=>p.invoiceId===old.id).reduce((sum,p)=>sum+(Number(p.amount)||0),0);if(inv.paid+previousPayments>total(inv)){alert('الإجمالي الجديد أقل من إجمالي المبالغ المدفوعة بالفعل. عدّل الإجمالي أو راجع الدفعات أولاً.');return;}old.lines.forEach(l=>{if(l.itemId){let it=db.items.find(x=>x.id===l.itemId);if(it)it.qty+=Number(l.qty)||0}});inv.id=old.id;inv.paid=Number($('paidNow').value)||0;db.invoices[db.invoices.findIndex(x=>x.id===old.id)]=inv;id=old.id;window.editingInvoiceId=null}else db.invoices.push(inv);inv.lines.forEach(l=>{if(l.itemId){let it=db.items.find(x=>x.id===l.itemId);if(it)it.qty=Math.max(0,it.qty-l.qty)}});save();openInvoice(id)}
function openInvoice(id){window.currentInvoice=db.invoices.find(i=>i.id===id);go('detail')}function detail(i){

</section><div class="no-print card" style="margin:0 0 12px;padding:12px"><label for="invoiceProductionStatus">تحديث حالة الشغل</label><div class="row"><select id="invoiceProductionStatus"><option ${((i.productionStatus||'قيد التصميم')==='قيد التصميم')?'selected':''}>قيد التصميم</option><option ${i.productionStatus==='قيد الطباعة'?'selected':''}>قيد الطباعة</option><option ${i.productionStatus==='جاهز للتسليم'?'selected':''}>جاهز للتسليم</option><option ${i.productionStatus==='تم التسليم'?'selected':''}>تم التسليم</option></select><button onclick="updateProductionStatus(${i.id})">حفظ الحالة</button></div></div>

}function editInvoice(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;window.editingInvoiceId=id;invoiceDraft=i.lines.map(l=>({...l}));go('new');setTimeout(()=>{if($('custName'))$('custName').value=i.customer||'';if($('custPhone'))$('custPhone').value=i.phone||'';if($('invDate'))$('invDate').value=i.date||'';if($('payMethod'))$('payMethod').value=i.method||'نقدي';if($('productionStatus'))$('productionStatus').value=i.productionStatus||'قيد التصميم';if($('deliveryDate'))$('deliveryDate').value=i.deliveryDate||'';if($('invoiceNotes'))$('invoiceNotes').value=i.notes||'';if($('discount'))$('discount').value=i.discount||'';if($('paidNow'))$('paidNow').value=i.paid||'';$('content').querySelector('h2').textContent='تعديل الفاتورة';calcDraft()},0)}function updateProductionStatus(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;i.productionStatus=$('invoiceProductionStatus').value;save();render()}function addPayment(id){let i=db.invoices.find(x=>x.id===id),a=Number(prompt('قيمة الدفعة بالجنيه'));if(!a||a<=0)return;if(a>due(i)){alert('الدفعة أكبر من المبلغ المتبقي');return}let method=prompt('طريقة الدفع: نقدي / تحويل / محفظة','نقدي')||'نقدي';db.payments.push({id:Date.now(),invoiceId:id,amount:a,method,date:new Date().toISOString().slice(0,10)});save();render()}function deleteInvoice(id){if(!confirm('هل تريد حذف الفاتورة؟ اضغط موافق للتأكيد الأول.'))return;if(!confirm('تأكيد نهائي: سيتم حذف الفاتورة وسجل دفعاتها.'))return;let doomed=db.invoices.find(i=>i.id===id);if(doomed)doomed.lines.forEach(l=>{if(l.itemId){let it=db.items.find(x=>x.id===l.itemId);if(it)it.qty+=Number(l.qty)||0}});db.invoices=db.invoices.filter(i=>i.id!==id);db.payments=db.payments.filter(p=>p.invoiceId!==id);save();go('invoices')}function shareWhatsApp(id){let i=db.invoices.find(x=>x.id===id),msg=`${db.shop}\nفاتورة رقم: ${i.id}\nالعميل: ${i.customer}\nالتاريخ: ${i.date}\nالإجمالي: ${money(total(i))}\nالمدفوع: ${money(paid(i))}\nالمتبقي: ${money(due(i))}\nشكراً لتعاملكم معنا`;let phone=(i.phone| function expensesPage(){let arr=(db.expenses||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))),sum=arr.reduce((s,e)=>s+(Number(e.amount)||0),0);return `<div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('عدد المصروفات',arr.length,'💸')}${stat('إجمالي المصروفات',money(sum),'−')}</div><div class="card"><h2>تسجيل مصروف جديد</h2><form onsubmit="saveExpense(event)"><div class="formgrid"><div><label>نوع المصروف</label><select id="expenseCategory"><option>أحبار وخامات</option><option>صيانة</option><option>كهرباء</option><option>إيجار</option><option>يوميات عمال</option><option>نقل</option><option>أخرى</option></select></div><div><label>المبلغ (ج.م) *</label><input id="expenseAmount" type="number" min="0.01" step="0.01" required placeholder="المبلغ"></div><div><label>التاريخ</label><input id="expenseDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>ملاحظات</label><input id="expenseNote" placeholder="تفاصيل اختيارية"></div></div><div class="actions"><button type="submit">حفظ المصروف</button></div></form></div><div class="card"><h2>سجل المصروفات</h2>${arr.length?`<div class="list">${arr.map(e=>`<div class="invoice"><div><b>${esc(e.category)}</b><div class="muted">${esc(e.date)} ${e.note?' · '+esc(e.note):''}</div></div><b>${money(e.amount)}</b><button class="danger" onclick="deleteExpense(${e.id})">حذف</button></div>`).join('')}</div>`:'<div class="empty">لا توجد مصروفات مسجلة.</div>'}</div>`}function saveExpense(e){e.preventDefault();let amount=Number($('expenseAmount').value);if(!Number.isFinite(amount)||amount<=0){alert('اكتب مبلغًا صحيحًا');return}(db.expenses||(db.expenses=[])).push({id:Date.now(),category:$('expenseCategory').value,amount,date:$('expenseDate').value,note:$('expenseNote').value.trim()});save();render()}function deleteExpense(id){if(!confirm('حذف المصروف؟'))return;db.expenses=db.expenses.filter(e=>e.id!==id);save();render()}
function uniqueCustomers(){return [...new Set(db.invoices.map(i=>i.customer))]}function customers(){let cs=uniqueCustomers().map(name=>{let a=db.invoices.filter(i=>i.customer===name);return{name,count:a.length,sales:a.reduce((s,i)=>s+total(i),0),debt:a.reduce((s,i)=>s+due(i),0)}}).sort((a,b)=>b.debt-a.debt);return `<div class="card"><div class="section-title"><h2>العملاء</h2><span class="pill">${cs.length} عميل</span></div>${cs.length?`<div class="list">${cs.map(c=>`<div class="invoice"><div><b>${esc(c.name)}</b><div class="amounts"><span>${c.count} فاتورة</span><span>المبيعات: ${money(c.sales)}</span><span>المديونية: ${money(c.debt)}</span></div></div><button class="secondary" onclick="window.currentCustomer='${esc(c.name).replace(/'/g,"\\'")}';go('customerDetail')">الفواتير ←</button></div>`).join('')}</div>`:'<div class="empty">سيظهر العملاء هنا بعد إنشاء الفواتير.</div>'}</div>`}function customerDetail(name){let a=db.invoices.filter(i=>i.customer===name).reverse();return `<div class="card"><div class="section-title"><h2>${esc(name)}</h2><button class="secondary" onclick="go('customers')">رجوع</button></div>${invoiceList(a)}</div>`}

button type="button" class="secondary" onclick="clearDebtInline()">تفريغ الحقول</button></div></form></div><div class="card" style="margin-top:14px"><div class="section-title"><h2>سجل الديون</h2><span class="pill">${arr.length} دين</span></div><input id="debtSearchInline" placeholder="ابحث باسم المورد أو سبب الدين..." oninput="filterDebtsInline()"><div id="debtResultsInline" style="margin-top:16px">${debtsList(arr)}</div><div class="actions"><button class="secondary" onclick="editInvoice(${i.id})">✎ تعديل الفاتورة</button><button class="secondary" onclick="window.print()">طباعة / حفظ PDF</button></div></div>`}
function debtsList(arr){if(!arr.length)return '<div class="empty">مفيش ديون مسجلة لحد دلوقتي. أضف أول دين من النموذج بالأعلى.</div>';return `<div class="list">${arr.map(d=>{let left=Math.max(0,(Number(d.amount)||0)-(Number(d.paid)||0));return `<div class="invoice debt-record"><div class="debt-record-main"><b>${esc(d.person)}</b><span class="status ${left>0?'due':''}">${left>0?'متبقي':'تم السداد'}</span><div class="muted" style="margin-top:5px">${esc(d.reason||'بدون وصف')} · ${esc(d.date||'')}</div><div class="amounts"><span>أصل الدين: ${money(d.amount)}</span><span>المدفوع: ${money(d.paid)}</span><span>المتبقي: <b class="gold">${money(left)}</b></span></div>${d.notes?`<small>${esc(d.notes)}</small>`:''}</div><div class="actions debt-record-actions"><button class="secondary" onclick="debtPayment(${d.id})" ${left<=0?'disabled':''}>＋ سداد</button><button class="secondary" onclick="editDebtInline(${d.id})">تعديل</button><button class="danger" onclick="deleteDebt(${d.id})">حذف</button></div></div>`}).join('')}</div>`}
function filterDebtsInline(){let q=($('debtSearchInline').value||'').toLowerCase();$('debtResultsInline').innerHTML=debtsList((db.debts||[]).filter(d=>(d.person+' '+(d.reason||'')).toLowerCase().includes(q)))}function editDebtInline(id){editingDebtId=id;render();$('content').scrollIntoView({behavior:'smooth',block:'start'})}function cancelDebtEdit(){editingDebtId=null;render()}function clearDebtInline(){if(editingDebtId){editingDebtId=null;render();return}['debtPersonInline','debtReasonInline','debtAmountInline','debtPaidInline','debtNotesInline'].forEach(id=>{if($(id))$(id).value=''});if($('debtDateInline'))$('debtDateInline').value=new Date().toISOString().slice(0,10)}function saveDebtInline(e,id){e.preventDefault();let person=$('debtPersonInline').value.trim(),reason=$('debtReasonInline').value.trim(),date=$('debtDateInline').value,amount=Number($('debtAmountInline').value),paid=Number($('debtPaidInline').value),notes=$('debtNotesInline').value.trim();if(!person||!Number.isFinite(amount)||amount<=0||!Number.isFinite(paid)||paid<0||paid>amount){alert('راجع البيانات: المدفوع لازم يكون من صفر لإجمالي الدين.');return}let obj={id:id||Date.now(),person,reason,date,amount,paid,notes};db.debts=db.debts||[];if(id){let index=db.debts.findIndex(x=>x.id===id);if(index<0)return;db.debts[index]=obj}else db.debts.push(obj);editingDebtId=null;save();render()}

function itemsPage(){let cats=[...new Set(db.items.map(i=>i.category||'عام'))];return `<div class="card"><div class="section-title"><h2>مخزن الأصناف</h2><button onclick="itemForm()">＋ إضافة صنف</button></div><input id="itemSearch" placeholder="ابحث باسم الصنف أو القسم..." oninput="filterItems()"><div id="itemsResults" style="margin-top:16px">${itemsList(db.items)}</div><div class="actions"><button class="secondary" onclick="go('prices')">بيان الأسعار ←</button></div></div>`}function itemsList(arr){let cats=[...new Set(arr.map(i=>i.category||'عام'))];if(!arr.length)return '<div class="empty">لا توجد أصناف مطابقة.</div>';return cats.map(cat=>`<h3 class="gold" style="margin-top:20px">${esc(cat)}</h3><div class="list">${arr.filter(i=>(i.category||'عام')===cat).map(i=>`<div class="invoice"><div><b>${esc(i.name)}</b> ${i.qty<=10?'<span class="status due">رصيد منخفض</span>':''}<div class="amounts"><span>بيع: ${money(i.sell)}</span><span>تكلفة: ${money(i.buy)}</span><span>الرصيد: ${i.qty} ${esc(i.unit)}</span></div></div><div class="actions" style="margin:0"><button class="secondary" onclick="itemForm(${i.id})">تعديل</button><button class="danger" onclick="deleteItem(${i.id})">حذف</button></div></div>`).join('')}</div>`).join('')}function filterItems(){let q=$('itemSearch').value.toLowerCase();$('itemsResults').innerHTML=itemsList(db.items.filter(i=>(i.name+' '+i.category).toLowerCase().includes(q)))}function itemForm(id){let existing=db.items.find(x=>x.id===id);let i=existing||{name:'',category:'مطبوعات',buy:0,sell:0,qty:0,unit:'قطعة'};let cats=[...new Set(['مطبوعات','لافتات وبنرات','ورقيات','استيكرات','خامات','أخرى',...db.items.map(x=>x.category||'عام')])];let backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.id='itemModalBackdrop';backdrop.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle"><div class="modal-head"><h2 id="itemModalTitle">${id?'تعديل الصنف':'إضافة صنف جديد'}</h2><button type="button" class="modal-close" onclick="closeItemForm()" aria-label="إغلاق">✕</button></div><form id="itemModalForm" onsubmit="saveItemForm(event,${id||'null'})"><div class="formgrid"><div class="full"><label for="itemName">اسم الصنف *</label><input id="itemName" required maxlength="120" value="${esc(i.name)}" placeholder="مثال: بنر أو كروت شخصية"></div><div><label for="itemCategory">القسم *</label><input id="itemCategory" list="itemCategoryOptions" required maxlength="80" value="${esc(i.category)}" placeholder="اختر أو اكتب قسمًا"><datalist id="itemCategoryOptions">${cats.map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist></div><div><label for="itemUnit">وحدة القياس *</label><select id="itemUnit" required>${['قطعة','متر','متر مربع','علبة','رزمة','كيلو','لفة','طقم','خدمة','أخرى'].map(u=>`<option ${i.unit===u?'selected':''} value="${u}">${u}</option>`).join('')}${!['قطعة','متر','متر مربع','علبة','رزمة','كيلو','لفة','طقم','خدمة','أخرى'].includes(i.unit)?`<option selected value="${esc(i.unit)}">${esc(i.unit)}</option>`:''}</select></div><div><label for="itemBuy">سعر الشراء / التكلفة (ج.م)</label><input id="itemBuy" type="number" min="0" step="0.01" required value="${Number(i.buy)||0}"></div><div><label for="itemSell">سعر البيع (ج.م)</label><input id="itemSell" type="number" min="0" step="0.01" required value="${Number(i.sell)||0}"></div><div class="full"><label for="itemQty">الرصيد الحالي</label><input id="itemQty" type="number" min="0" step="0.01" required value="${Number(i.qty)||0}"></div></div><div class="modal-actions"><button type="submit">حفظ الصنف</button><button type="button" class="secondary" onclick="closeItemForm()">إلغاء</button></div></form></section>`;backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeItemForm()});document.body.appendChild(backdrop);document.body.classList.add('modal-open');$('itemName').focus()}function closeItemForm(){let modal=$('itemModalBackdrop');if(modal)modal.remove();document.body.classList.remove('modal-open')}function saveItemForm(event,id){event.preventDefault();let name=$('itemName').value.trim(),category=$('itemCategory').value.trim()||'عام',unit=$('itemUnit').value,buy=Number($('itemBuy').value),sell=Number($('itemSell').value),qty=Number($('itemQty').value);if(!name){alert('اسم الصنف مطلوب');$('itemName').focus();return}if([buy,sell,qty].some(n=>!Number.isFinite(n)||n<0)){alert('تأكد أن الأسعار والرصيد أرقام صحيحة غير سالبة');return}if(id){let i=db.items.find(x=>x.id===id);if(!i){closeItemForm();return}Object.assign(i,{name,category,buy,sell,qty,unit})}else db.items.push({id:Date.now(),name,category,buy,sell,qty,unit});save();closeItemForm();render()}function deleteItem(id){if(confirm('حذف الصنف من المخزن؟')){db.items=db.items.filter(i=>i.id!==id);save();render()}}function prices(){return `<div class="card" id="priceArea"><div class="section-title"><div><h2 class="gold">${esc(db.shop)}</h2><p class="muted">بيان أسعار الأصناف</p></div><button class="secondary no-print" onclick="window.print()">طباعة / حفظ PDF</button></div>${[...new Set(db.items.map(i=>i.category||'عام'))].map(cat=>`<h3>${esc(cat)}</h3><div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>سعر البيع</th><th>التكلفة</th><th>الرصيد</th></tr></thead><tbody>${db.items.filter(i=>(i.category||'عام')===cat).map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${money(i.sell)}</td><td>${money(i.buy)}</td><td>${i.qty}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`}function settings(){if(role!=='owner')return '<div class="card">هذه الصفحة متاحة للمالك فقط.</div>';let owner=db.users.owner||{username:'المالك',password:'1234'},staff=db.users.staff||{username:'موظف',password:'1234'};return `<div class="card"><h2>إعدادات المطبعة</h2><label>اسم المطبعة</label><input id="shopName" value="${esc(db.shop)}"><label for="shopAddress">عنوان المطبعة (يظهر على الفاتورة)</label><input id="shopAddress" value="${esc(db.address||'')}" placeholder="مثال: المنيا - بجوار موقف العبور"><label>شعار المطبعة</label><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><div class="logo" id="logoPreview" style="margin:0;width:76px;height:76px;overflow:hidden">${db.logo?`<img src="${db.logo}" style="width:100%;height:100%;object-fit:contain">`:'▤'}</div><div style="flex:1;min-width:180px"><input id="logoFile" type="file" accept="image/*" onchange="previewLogo(event)"><p class="muted" style="font-size:12px;margin-top:6px">اختر صورة PNG أو JPG. سيظهر الشعار في واجهة البرنامج والفواتير.</p><button type="button" class="secondary" onclick="removeLogo()">إزالة الشعار</button></div></div><h3 class="gold" style="margin-top:24px">تعديل بيانات الدخول</h3><p class="muted">غيّر اسم المستخدم وكلمة المرور لكل حساب. احتفظ بكلمة المرور الجديدة في مكان آمن.</p><div class="formgrid"><div><label>اسم مستخدم المالك</label><input id="ownerUsername" value="${esc(owner.username)}" autocomplete="off"></div><div><label>كلمة مرور المالك الجديدة</label><input id="ownerPassword" type="password" placeholder="اتركها فارغة للإبقاء على الحالية"></div><div><label>اسم مستخدم الموظف</label><input id="staffUsername" value="${esc(staff.username)}" autocomplete="off"></div><div><label>كلمة مرور الموظف الجديدة</label><input id="staffPassword" type="password" placeholder="اتركها فارغة للإبقاء على الحالية"></div></div><label>رابط التطبيق على الكمبيوتر (بعد النشر)</label><div class="row"><input id="appUrl" value="${location.href}" readonly><button class="secondary" onclick="copyUrl()">نسخ</button></div><div class="notice">المزامنة السحابية غير مفعّلة بعد. بيانات الدخول والشعار محفوظة محليًا في هذا المتصفح، وليست نظام مصادقة آمنًا للاستخدام عبر الإنترنت.</div><h3>نسخة احتياطية</h3><p class="muted">تصدير الفواتير والعملاء والأصناف والإعدادات بصيغة JSON.</p><div class="actions"><button onclick="backup()">تصدير نسخة احتياطية</button><button class="secondary" onclick="$('restoreFile').click()">استيراد نسخة احتياطية</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)"></div><div class="actions"><button onclick="saveSettings()">حفظ الإعدادات</button><button class="danger" onclick="logout()">تسجيل الخروج</button></div></div><div class="card" style="margin-top:14px"><h2>صلاحيات المستخدمين</h2><p>المالك: إدارة الفواتير والمخزن والإعدادات والنسخ الاحتياطية وتعديل بيانات الدخول.</p><p>الموظف: إنشاء الفواتير وعرض العملاء والأصناف وبيان الأسعار، دون الوصول للإعدادات.</p><p class="footerhint">ملاحظة: الصلاحيات وبيانات الدخول في هذه النسخة تجريبية محلية، ويجب تأمينها على الخادم قبل الاستخدام الفعلي متعدد المستخدمين.</p></div>`}function previewLogo(e){let f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('اختر ملف صورة صالحًا');return}if(f.size>2*1024*1024){alert('حجم الشعار يجب ألا يتجاوز 2 ميجابايت');e.target.value='';return}let r=new FileReader();r.onload=()=>{$('logoPreview').innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:contain">`;db.logo=r.result};r.readAsDataURL(f)}function removeLogo(){db.logo='';$('logoPreview').textContent='▤';$('logoFile').value=''}function saveSettings(){let ownerName=$('ownerUsername').value.trim(),staffName=$('staffUsername').value.trim();if(!ownerName||!staffName){alert('اكتب اسم مستخدم لكلا الحسابين');return}db.shop=$('shopName').value.trim()||'مطبعة';db.address=$('shopAddress').value.trim();db.users=db.users||{};db.users.owner=db.users.owner||{username:'المالك',password:'1234'};db.users.staff=db.users.staff||{username:'موظف',password:'1234'};db.users.owner.username=ownerName;db.users.staff.username=staffName;if($('ownerPassword').value)db.users.owner.password=$('ownerPassword').value;if($('staffPassword').value)db.users.staff.password=$('staffPassword').value;save();applyBrand();$('welcome').textContent='أهلاً '+user+' — '+db.shop;alert('تم حفظ الإعدادات وبيانات الدخول على هذا الجهاز');render()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fawateer-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.invoices)||!Array.isArray(x.items)||typeof x!=='object')throw Error();x.customers=x.customers||[];x.payments=x.payments||[];x.debts=x.debts||[];x.users=x.users||{owner:{username:'المالك',password:'1234'},staff:{username:'موظف',password:'1234'}};db=x;save();alert('تم استيراد النسخة الاحتياطية');render()}catch(err){alert('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}function copyUrl(){navigator.clipboard?.writeText($('appUrl').value).then(()=>alert('تم النسخ')).catch(()=>prompt('انسخ الرابط:', $('appUrl').value))||prompt('انسخ الرابط:', $('appUrl').value)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script></body></html>
